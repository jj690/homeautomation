
services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    privileged: true
    environment:
      TZ: Europe/Berlin
    volumes:
      - ./homeassistant/config:/config
      - /run/dbus:/run/dbus:ro
  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}:=admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}:=admin
      POSTGRES_DB: ${POSTGRES_DB}:=homeautomation
      TZ: Europe/Berlin
    ports:
      # - "127.0.0.1:5432:5432" # only allow local connections
      - "5432:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}:=admin -d ${POSTGRES_DB}:=homeautomation"]
      interval: 10s
      timeout: 5s
      retries: 5

